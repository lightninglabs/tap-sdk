version: "3.8"

# tap-sdk integration test infrastructure.
# bitcoind (regtest) ← lnd-alice + lnd-bob ← tapd-alice + tapd-bob
#
# Usage:
#   docker compose -f itest/docker-compose.yml up -d
#   go test -v -tags=itest ./itest/...
#   docker compose -f itest/docker-compose.yml down -v

services:
  # ---------- Bitcoin Core (regtest) ----------
  bitcoind:
    image: lncm/bitcoind:v28.0
    container_name: tap-sdk-bitcoind
    command:
      - -regtest
      - -server=1
      - -txindex=1
      - -rpcuser=devuser
      - -rpcpassword=devpass
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcport=18443
      - -zmqpubrawblock=tcp://0.0.0.0:28334
      - -zmqpubrawtx=tcp://0.0.0.0:28335
      - -fallbackfee=0.00001
      - -dnsseed=0
      - -upnp=0
      - -listen=0
      - -listenonion=0
    ports:
      - "18443:18443"
      - "28334:28334"
      - "28335:28335"
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=devuser",
             "-rpcpassword=devpass", "getblockchaininfo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- LND Alice ----------
  lnd-alice:
    image: lightninglabs/lnd:v0.20.1-beta
    container_name: tap-sdk-lnd-alice
    depends_on:
      bitcoind:
        condition: service_healthy
    command:
      - --noseedbackup
      - --norest
      - --debuglevel=info
      - --alias=alice
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind:18443
      - --bitcoind.rpcuser=devuser
      - --bitcoind.rpcpass=devpass
      - --bitcoind.zmqpubrawblock=tcp://bitcoind:28334
      - --bitcoind.zmqpubrawtx=tcp://bitcoind:28335
      - --rpclisten=0.0.0.0:10009
      - --tlsextradomain=lnd-alice
      - --tlsextraip=0.0.0.0
    ports:
      - "10009:10009"
    volumes:
      - lnd-alice-data:/root/.lnd
    healthcheck:
      test: ["CMD", "lncli", "--network=regtest", "getinfo"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------- LND Bob ----------
  lnd-bob:
    image: lightninglabs/lnd:v0.20.1-beta
    container_name: tap-sdk-lnd-bob
    depends_on:
      bitcoind:
        condition: service_healthy
    command:
      - --noseedbackup
      - --norest
      - --debuglevel=info
      - --alias=bob
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind:18443
      - --bitcoind.rpcuser=devuser
      - --bitcoind.rpcpass=devpass
      - --bitcoind.zmqpubrawblock=tcp://bitcoind:28334
      - --bitcoind.zmqpubrawtx=tcp://bitcoind:28335
      - --rpclisten=0.0.0.0:10009
      - --tlsextradomain=lnd-bob
      - --tlsextraip=0.0.0.0
    ports:
      - "10010:10009"
    volumes:
      - lnd-bob-data:/root/.lnd
    healthcheck:
      test: ["CMD", "lncli", "--network=regtest", "getinfo"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------- tapd Alice ----------
  tapd-alice:
    image: lightninglabs/taproot-assets:v0.7.2
    container_name: tap-sdk-tapd-alice
    depends_on:
      lnd-alice:
        condition: service_healthy
    command:
      - --network=regtest
      - --debuglevel=info
      - --lnd.host=lnd-alice:10009
      - --lnd.macaroonpath=/root/.lnd/data/chain/bitcoin/regtest/admin.macaroon
      - --lnd.tlspath=/root/.lnd/tls.cert
      - --rpclisten=0.0.0.0:10029
      - --restlisten=0.0.0.0:8089
      - --allow-public-uni-proof-courier
      - --allow-public-stats
      - --universe.public-access=rw
    ports:
      - "10029:10029"
      - "8089:8089"
    volumes:
      - lnd-alice-data:/root/.lnd:ro
      - tapd-alice-data:/root/.tapd
    healthcheck:
      test: ["CMD", "tapcli", "--network=regtest", "getinfo"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------- tapd Bob ----------
  tapd-bob:
    image: lightninglabs/taproot-assets:v0.7.2
    container_name: tap-sdk-tapd-bob
    depends_on:
      lnd-bob:
        condition: service_healthy
    command:
      - --network=regtest
      - --debuglevel=info
      - --lnd.host=lnd-bob:10009
      - --lnd.macaroonpath=/root/.lnd/data/chain/bitcoin/regtest/admin.macaroon
      - --lnd.tlspath=/root/.lnd/tls.cert
      - --rpclisten=0.0.0.0:10029
      - --restlisten=0.0.0.0:8089
      - --allow-public-uni-proof-courier
      - --allow-public-stats
      - --universe.public-access=rw
    ports:
      - "10030:10029"
      - "8090:8089"
    volumes:
      - lnd-bob-data:/root/.lnd:ro
      - tapd-bob-data:/root/.tapd
    healthcheck:
      test: ["CMD", "tapcli", "--network=regtest", "getinfo"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  bitcoind-data:
  lnd-alice-data:
  lnd-bob-data:
  tapd-alice-data:
  tapd-bob-data:
