# Local-only override that rebuilds tapd from taproot-assets `main` each
# time the stack is brought up. Use it when you need to validate SDK changes
# against unreleased tapd behavior before the next tapd release image.
#
# Usage:
#   docker compose \
#     -f itest/docker-compose.yml \
#     -f itest/docker-compose.local.yml \
#     up -d --build
#
#   go test -tags=itest -timeout=20m ./itest/...
#
# CI does not use this file — it keeps the pinned image so the workflow
# stays reproducible until the next tapd release.
#
# tapd main verifies TLS for universe, courier and mailbox connections, and
# the nodes' self-signed certificates do not name their compose hosts. The
# flags skip verification for those two hosts only. The pinned image rejects
# them, so they stay out of tapd/*.conf.

services:
  tapd-alice:
    image: tap-sdk/tapd:local
    build:
      context: https://github.com/lightninglabs/taproot-assets.git#main
      args:
        checkout: main
    command:
      - --universe.tls.insecurehost=tapd-alice
      - --universe.tls.insecurehost=tapd-bob

  tapd-bob:
    image: tap-sdk/tapd:local
    build:
      context: https://github.com/lightninglabs/taproot-assets.git#main
      args:
        checkout: main
    command:
      - --universe.tls.insecurehost=tapd-alice
      - --universe.tls.insecurehost=tapd-bob
